name: Auto format

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (pnpm)
        run: mise exec -- pnpm install
      - name: Configure git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Auto format (prettier)
        run: |
          git ls-files '**.yml' '**.yaml' '**.json' '**.md' '**.xml' -z | xargs -0 mise exec -- pnpm exec prettier --write
      # Cannot modify .github/workflows (refusing to allow a GitHub App to create or update workflow)
      - name: Ignore github .github/workflows
        run: |
          git checkout .github/workflows
      - name: Commit changes (prettier)
        run: |
          git add -u
          git commit -m 'style: `prettier --write`' || true
      - name: Push changes
        run: |
          git push
